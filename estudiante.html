<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExcelData Quest - Acceso Estudiante</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <script src="preguntas.js"></script>

    <style>
        :root { --primary: #107c41; --secondary: #217346; --dark: #1b1b1b; --light: #f3f2f1; --accent: #ffb900; --danger: #d83b01; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--light); color: var(--dark); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 95vh; }
        .container { width: 90%; max-width: 900px; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.1); text-align: center; }
        h1 { color: var(--primary); margin-bottom: 5px; }
        .screen { display: none; }
        .screen.active { display: block; }
        .form-group { margin: 15px 0; text-align: left; max-width: 400px; margin-left: auto; margin-right: auto; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input[type="text"] { width: 100%; padding: 12px; font-size: 1rem; border: 2px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        .btn { background-color: var(--primary); color: white; border: none; padding: 12px 25px; font-size: 1.1rem; border-radius: 6px; cursor: pointer; font-weight: bold; transition: background 0.2s; }
        .btn:hover { background-color: var(--secondary); }
        .pin-display { background: #fff8dc; border: 2px dashed var(--accent); padding: 15px; font-size: 1.5rem; font-weight: bold; border-radius: 8px; display: inline-block; margin: 10px 0; }
        .question-counter { font-size: 0.85rem; color: #605e5c; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px; }
        .question-text { font-size: 1.4rem; font-weight: 600; margin-bottom: 25px; }
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .option-btn { padding: 22px; font-size: 1.1rem; font-weight: 600; border: none; border-radius: 8px; cursor: pointer; color: white; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .option-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .opt-0 { background-color: #d83b01; } .opt-1 { background-color: #0078d4; } .opt-2 { background-color: #107c41; } .opt-3 { background-color: #b4009e; }
        .podium-list { list-style: none; padding: 0; max-width: 500px; margin: 0 auto 20px auto; text-align: left; }
        .podium-item { background: #faf9f8; margin: 8px 0; padding: 12px 20px; border-radius: 6px; display: flex; justify-content: space-between; font-weight: bold; font-size: 1.1rem; border-left: 5px solid var(--primary); }
    </style>
</head>
<body>

<div class="container">
    <h1>📊 ExcelData Quest</h1>
    <p style="color: #605e5c; margin-top: 0;">Plataforma Interactiva para Estudiantes</p>

    <!-- PANTALLA DE REGISTRO DIRECTO -->
    <div id="screen-student-login" class="screen active">
        <h3>Ingresa a la Sala</h3>
        <div class="form-group">
            <label>PIN de la Sala:</label>
            <input type="text" id="input-pin" placeholder="Ej: 8420" maxlength="4">
        </div>
        <div class="form-group">
            <label>Tu Nombre y Apellido / N° de Lista:</label>
            <input type="text" id="input-name" placeholder="Ej: Sofia Pérez - 15">
        </div>
        <button class="btn" onclick="registerStudent()">Unirme al Juego 🚀</button>
        <p id="login-error" style="color: var(--danger); font-weight: bold; margin-top: 10px;"></p>
    </div>

    <!-- PANTALLA DE ESPERA -->
    <div id="screen-student-waiting" class="screen">
        <div class="pin-display" id="student-welcome-msg">¡Hola! 👋</div>
        <p style="font-size: 1.2rem; color: var(--primary); font-weight: bold; margin: 20px 0;">
            Te has registrado correctamente.<br>Espera a que el profesor inicie la partida en el proyector...
        </p>
    </div>

    <!-- PANTALLA DE PREGUNTA / JUEGO -->
    <div id="screen-student-quiz" class="screen">
        <div class="question-counter" id="student-q-counter">Pregunta en curso</div>
        <div class="question-text" id="student-q-text">Cargando...</div>
        <div class="options-grid" id="student-options-container"></div>
        <div id="student-feedback" style="font-size: 1.2rem; font-weight: bold; margin-top: 15px;"></div>
    </div>

    <!-- PANTALLA DE PODIO FINAL -->
    <div id="screen-podium" class="screen">
        <h2>🎉 ¡Podio Final del Concurso!</h2>
        <ul class="podium-list" id="podium-ranking"></ul>
    </div>
</div>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyCWca4NWYFvuKpYINgfrjqtVbfCMNr9GKo",
    authDomain: "exceldataquest.firebaseapp.com",
    databaseURL: "https://exceldataquest-default-rtdb.firebaseio.com",
    projectId: "exceldataquest",
    storageBucket: "exceldataquest.firebasestorage.app",
    messagingSenderId: "108453200501",
    appId: "1:108453200501:web:93dc991ceadc63ab476e3c",
    measurementId: "G-LHD57H151E"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const ROOM_PIN = "8420";

let myStudentName = "";
let myStudentId = "";
let lastRenderedQuestion = -1; // Control para evitar reinicios de pantalla

function showScreen(screenId) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(screenId).classList.add('active');
}

function registerStudent() {
    let pinInput = document.getElementById('input-pin').value.trim();
    myStudentName = document.getElementById('input-name').value.trim();
    let errorMsg = document.getElementById('login-error');

    if (pinInput !== ROOM_PIN) {
        errorMsg.innerText = "PIN incorrecto. Consulta con el profesor.";
        return;
    }
    if (myStudentName === "") {
        errorMsg.innerText = "Ingresa tu nombre.";
        return;
    }

    myStudentId = 'user_' + Math.random().toString(36).substr(2, 9);
    db.ref('salas/' + ROOM_PIN + '/jugadores/' + myStudentId).set({
        nombre: myStudentName,
        puntaje: 0
    });

    showScreen('screen-student-waiting');
    document.getElementById('student-welcome-msg').innerText = `¡Hola, ${myStudentName}! 👋`;

    db.ref('salas/' + ROOM_PIN).on('value', (snapshot) => {
        let roomData = snapshot.val();
        if (!roomData) return;

        if (roomData.estado === 'jugando') {
            // Solo redibuja si cambia de pregunta realmente
            if (lastRenderedQuestion !== roomData.preguntaActual) {
                lastRenderedQuestion = roomData.preguntaActual;
                showScreen('screen-student-quiz');
                renderStudentQuestion(roomData.preguntaActual);
            }
        } else if (roomData.estado === 'terminado') {
            showScreen('screen-podium');
            showPodiumScreen();
        }
    });
}

function renderStudentQuestion(qIndex) {
    let q = bancoPreguntas[qIndex];
    document.getElementById('student-q-counter').innerText = `Pregunta ${qIndex + 1} de ${bancoPreguntas.length}`;
    document.getElementById('student-q-text').innerText = q.q;
    document.getElementById('student-feedback').innerText = "";

    let optionsContainer = document.getElementById('student-options-container');
    optionsContainer.innerHTML = "";

    q.options.forEach((opt, index) => {
        let btn = document.createElement('button');
        btn.className = `option-btn opt-${index}`;
        btn.innerText = opt;
        
        let currentOptIndex = index;
        let correctOptIndex = parseInt(q.correct);

        btn.onclick = function() {
            submitAnswer(qIndex, currentOptIndex, correctOptIndex);
        };
        
        optionsContainer.appendChild(btn);
    });
}

function submitAnswer(qIndex, selectedIdx, correctIdx) {
    let buttons = document.querySelectorAll('#student-options-container button');
    buttons.forEach(b => b.disabled = true);

    let feedback = document.getElementById('student-feedback');
    let isCorrect = (selectedIdx === correctIdx);

    if (isCorrect) {
        feedback.style.color = "#107c41";
        feedback.innerText = "¡Respuesta Correcta! 🎉 (+100 pts)";
        db.ref('salas/' + ROOM_PIN + '/jugadores/' + myStudentId + '/puntaje').transaction((currentScore) => {
            return (currentScore || 0) + 100;
        });
    } else {
        feedback.style.color = "#d83b01";
        feedback.innerText = `Incorrecto. Has seleccionado otra opción.`;
    }

    db.ref('salas/' + ROOM_PIN + '/respuestasRonda/' + qIndex + '/' + myStudentId).set(true);
}

function showPodiumScreen() {
    db.ref('salas/' + ROOM_PIN + '/jugadores').once('value', (snapshot) => {
        let data = snapshot.val();
        let rankingContainer = document.getElementById('podium-ranking');
        if (!data) return;
        let playersArray = Object.values(data);
        playersArray.sort((a, b) => (b.puntaje || 0) - (a.puntaje || 0));

        rankingContainer.innerHTML = playersArray.map((p, index) => {
            let medal = index === 0 ? "🥇" : index === 1 ? "🥈" : index === 2 ? "🥉" : `📌 #${index + 1}`;
            return `<li class="podium-item"><span>${medal} ${p.nombre}</span><span style="color: var(--primary);">${p.puntaje || 0} Puntos</span></li>`;
        }).join('');
    });
}
</script>

</body>
</html>
